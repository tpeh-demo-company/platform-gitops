---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: demo-app
  namespace: flux-system
spec:
  url: https://github.com/tpeh-demo-company/platform-demo-app.git
  ref:
    branch: main
  interval: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-app
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: demo-app
  path: ./deploy/app-dev
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
