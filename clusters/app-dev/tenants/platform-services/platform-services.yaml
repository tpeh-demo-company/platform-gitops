---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-services
  namespace: flux-system
spec:
  url: https://github.com/tpeh-demo-company/platform-services.git
  ref:
    branch: production
  interval: 1m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: platform-services
  path: ./environments/app-dev
  interval: 1m
  timeout: 10m0s
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
