apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: istio
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
    fluxcd.controlplane.io/force: "true"
spec:
  wait: true
  inputsFrom:
    - kind: ResourceSetInputProvider
      selector:
        matchLabels:
          app: istio
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: istio
        namespace: flux-system
      spec:
        interval: 30m
        url: https://istio-release.storage.googleapis.com/charts
        timeout: 1m
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istio-base
        namespace: flux-system
      spec:
        interval: 5m
        chart:
          spec:
            version: << inputs.version >>
            chart: base
            sourceRef:
              kind: HelmRepository
              name: istio
              namespace: flux-system
        targetNamespace: istio-system
        install:
          createNamespace: true
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istiod
        namespace: flux-system
      spec:
        interval: 5m
        dependsOn:
          - name: istio-base
        chart:
          spec:
            version: << inputs.version >>
            chart: istiod
            sourceRef:
              kind: HelmRepository
              name: istio
              namespace: flux-system
        targetNamespace: istio-system
        install:
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          global:
            istioNamespace: istio-system
          pilot:
            autoscaleEnabled: true
            autoscaleMin: 1
            autoscaleMax: 3
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            env:
              PILOT_ENABLE_ALPHA_GATEWAY_API: "true"
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: istio-ingress
        namespace: flux-system
      spec:
        interval: 5m
        dependsOn:
          - name: istiod
        chart:
          spec:
            version: << inputs.version >>
            chart: gateway
            sourceRef:
              kind: HelmRepository
              name: istio
              namespace: flux-system
        targetNamespace: istio-system
        install:
          timeout: 10m0s
          remediation:
            retries: 3
        upgrade:
          timeout: 10m0s
          remediation:
            retries: 3
            remediateLastFailure: true
        values:
          name: istio-ingressgateway
          replicaCount: 1
          service:
            type: LoadBalancer
            ports:
              - port: 80
                targetPort: 8080
                name: http2
              - port: 443
                targetPort: 8443
                name: https
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi