apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-services
spec:
  serviceAccountName: flux-infra
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./environments/${ENVIRONMENT}
  interval: 1m
  retryInterval: 2m
  timeout: 10m0s
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
