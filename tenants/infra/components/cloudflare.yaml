apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudflare
spec:
  serviceAccountName: flux-infra
  sourceRef:
    kind: GitRepository
    name: flux-infra
  path: ./environments/${ENVIRONMENT}/cloudflare
  interval: 1m
  retryInterval: 2m
  timeout: 10m0s
  prune: true
  wait: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: flux-runtime-info
