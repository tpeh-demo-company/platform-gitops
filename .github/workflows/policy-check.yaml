# =============================================================================
# .github/workflows/gitops.yaml — platform-gitops CI
# =============================================================================
# Validates GitOps manifests on every push to main and on pull requests.
# No cluster access required — purely static validation.
#
# Prerequisites (ubuntu-latest runner):
#   - conftest CLI (brew install open-policy-agent/tap/conftest)
#   - kustomize CLI (brew install kustomize)
# =============================================================================

name: GitOps Validation

on:
  pull_request:
    branches: [main]

jobs:
  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run conftest against infrastructure manifests
        run: conftest test infrastructure/ --policy policy/ --all-namespaces
